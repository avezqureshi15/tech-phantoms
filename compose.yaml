services:
  diya-postgres:
    image: postgres:16-alpine
    container_name: diya-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: diya
      POSTGRES_USER: diya
      POSTGRES_PASSWORD: ${DIYA_POSTGRES_PASSWORD:-diya-local-dev-only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - diya-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diya -d diya"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  diya-postgres-data:
