[project]
name = "festiveos-backend"
version = "0.1.0"
description = "FestiveOS API: families planning festivals and preserving traditions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14,<3",
    "email-validator>=2.4,<3",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "PyJWT>=2.15,<3",
    "google-auth>=2.63,<3",
    "requests>=2.34,<3",
    "redis>=8.2.0",
    "astronomy-engine>=2.1.19",
    "python-multipart>=0.0.20",
    "flagsmith>=6.7,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"festiveos.ai" = ["prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # starlette's TestClient prefers httpx2; httpx is what we have and works.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # generated-style files kept verbatim

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "SIM", "C4", "PIE", "RET",
    "RUF",
    "S",            # security
    "PT",           # pytest style
    "G", "LOG",     # logging
    "N",            # naming
    "TID",          # banned relative imports
    "T20",          # no print
    "FURB",
]
ignore = [
    "RET504",  # naming a value before returning it is often clearer
]

[tool.ruff.lint.per-file-ignores]
"src/festiveos/audio/catalog.py" = ["E501"]  # one line per track reads better than wrapping
"tests/conftest.py" = ["E402"]  # test settings must be in the environment before the app is imported
"tests/**" = [
    "S101",  # assert is the point of a test
    "S105", "S106",  # throwaway test credentials
    "PT011",
]

[tool.ruff.lint.isort]
known-first-party = ["festiveos", "tests"]
