name: diya

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &app-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      diya-server:
        condition: service_healthy
      festiveos-api:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging
    restart: unless-stopped

  diya-server:
    image: ${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/diya-server:${IMAGE_TAG:?Set IMAGE_TAG to an immutable tag}
    build:
      context: ../web/server
      dockerfile: Dockerfile
      target: production
    env_file:
      - ${SECRETS_DIR:-/run/secrets}/diya-server.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUSTED_PROXY_COUNT: "1"
    expose:
      - "4000"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    <<: *app-hardening

  diya-server-ops:
    image: ${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/diya-server:${IMAGE_TAG:?Set IMAGE_TAG to an immutable tag}-ops
    build:
      context: ../web/server
      dockerfile: Dockerfile
      target: ops
    env_file:
      - ${SECRETS_DIR:-/run/secrets}/diya-server.env
    environment:
      NODE_ENV: production
    profiles:
      - ops
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  festiveos-api:
    image: ${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/festiveos-backend:${IMAGE_TAG:?Set IMAGE_TAG to an immutable tag}
    build:
      context: ../mobile/backend
      dockerfile: Dockerfile
    env_file:
      - ${SECRETS_DIR:-/run/secrets}/festiveos.env
    environment:
      TRUSTED_PROXY_COUNT: "1"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REDIS_URL: redis://valkey:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    <<: *app-hardening

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: diya
      POSTGRES_USER: diya
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      DIYA_APP_PASSWORD_FILE: /run/secrets/diya-app-password
      FESTIVEOS_APP_PASSWORD_FILE: /run/secrets/festiveos-app-password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-tls:/var/lib/postgresql/tls
      - ${SECRETS_DIR:-/run/secrets}/postgres-password:/run/secrets/postgres-password:ro
      - ${SECRETS_DIR:-/run/secrets}/diya-app-password:/run/secrets/diya-app-password:ro
      - ${SECRETS_DIR:-/run/secrets}/festiveos-app-password:/run/secrets/festiveos-app-password:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diya -d diya"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1536m
    logging: *default-logging
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

volumes:
  pg-data: {}
  pg-tls: {}
  caddy-data: {}
  caddy-config: {}
